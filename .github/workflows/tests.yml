name: .NET Tests

on:
  push:
    branches:
      - test

  pull_request:
    branches:
      - test

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ClipSnip.slnx

      - name: Build
        run: dotnet build ClipSnip.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ClipSnip.slnx --configuration Release --no-build --verbosity normal