trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: "ClipSnip"
  resourceGroupName: "ClipSnip-rg"
  appName: "ClipSnip-webapp"
  buildConfiguration: "Release"
  keyVaultName: "clipsnip-kv-msu2"

steps:
  - task: AzureKeyVault@2
    displayName: "Fetch secrets from Key Vault"
    inputs:
      azureSubscription: "$(azureServiceConnection)"
      KeyVaultName: "$(keyVaultName)"
      SecretsFilter: "SqlAdminPassword"
      RunAsPreJob: true

  - task: AzureCLI@2
    displayName: "Deploy Azure infrastructure"
    inputs:
      azureSubscription: "$(azureServiceConnection)"
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        DEPLOYED_APP_NAME=$(az deployment group create \
          --resource-group "$(resourceGroupName)" \
          --template-file infra/main.bicep \
          --parameters \
            appName="$(appName)" \
            sqlAdminPassword="$SQL_ADMIN_PASSWORD" \
          --query "properties.outputs.appServiceName.value" \
          --output tsv)

        echo "Bicep returned: $DEPLOYED_APP_NAME"

        if [ -z "$DEPLOYED_APP_NAME" ]; then
          echo "ERROR: deployedAppName is empty"
          exit 1
        fi

        echo "##vso[task.setvariable variable=deployedAppName]$DEPLOYED_APP_NAME"
    env:
      SQL_ADMIN_PASSWORD: $(SqlAdminPassword)

  - script: |
      echo "Base appName: $(appName)"
      echo "Actual deployed app: $(deployedAppName)"
    displayName: "Debug deployed app name"

  - task: UseDotNet@2
    displayName: "Install .NET SDK"
    inputs:
      packageType: sdk
      version: "10.x"

  - script: dotnet restore
    displayName: "Restore packages"

  - script: dotnet build --configuration $(buildConfiguration) --no-restore
    displayName: "Build"

  - script: dotnet test --configuration $(buildConfiguration) --no-build --verbosity normal
    displayName: "Run tests"

  - script: |
      dotnet publish ClipSnip/ClipSnip.csproj \
        --configuration $(buildConfiguration) \
        --output $(Build.ArtifactStagingDirectory)/publish
    displayName: "Publish"

  - task: ArchiveFiles@2
    displayName: "Create deployment package"
    inputs:
      rootFolderOrFile: "$(Build.ArtifactStagingDirectory)/publish"
      includeRootFolder: false
      archiveType: zip
      archiveFile: "$(Build.ArtifactStagingDirectory)/clipsnip.zip"
      replaceExistingArchive: true

  - task: AzureWebApp@1
    displayName: "Deploy ClipSnip to App Service"
    inputs:
      azureSubscription: "$(azureServiceConnection)"
      appType: "webAppLinux"
      appName: "$(deployedAppName)"
      package: "$(Build.ArtifactStagingDirectory)/clipsnip.zip"
