trigger:
  branches:
    include:
      - main
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: "ClipSnip"
  resourceGroupName: "ClipSnip-rg"
  appName: "ClipSnip-webapp"
  buildConfiguration: "Release"
  keyVaultName: "clipsnip-kv-msu"

stages:

# =========================================================
# CI
# =========================================================

- stage: CI
  displayName: "Build and Test"

  jobs:
  - job: Build
    displayName: "Build ClipSnip"

    steps:

    - task: UseDotNet@2
      displayName: "Install .NET SDK"
      inputs:
        packageType: sdk
        version: "10.x"

    - script: dotnet restore
      displayName: "Restore packages"

    - script: dotnet build --configuration $(buildConfiguration) --no-restore
      displayName: "Build"

    - script: dotnet test --configuration $(buildConfiguration) --no-build --verbosity normal
      displayName: "Run tests"

    - script: |
        dotnet publish ClipSnip/ClipSnip.csproj \
          --configuration $(buildConfiguration) \
          --no-build \
          --output $(Build.ArtifactStagingDirectory)/publish
      displayName: "Publish"

    - task: ArchiveFiles@2
      displayName: "Create deployment package"
      inputs:
        rootFolderOrFile: "$(Build.ArtifactStagingDirectory)/publish"
        includeRootFolder: false
        archiveType: zip
        archiveFile: "$(Build.ArtifactStagingDirectory)/clipsnip.zip"
        replaceExistingArchive: true

    - task: PublishPipelineArtifact@1
      displayName: "Publish deployment artifact"
      inputs:
        targetPath: "$(Build.ArtifactStagingDirectory)/clipsnip.zip"
        artifact: "clipsnip"


# =========================================================
# CD
# =========================================================

- stage: CD
  displayName: "Deploy"
  dependsOn: CI
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: "Deploy ClipSnip"

    steps:

    - task: DownloadPipelineArtifact@2
      displayName: "Download deployment artifact"
      inputs:
        artifact: "clipsnip"
        path: "$(Pipeline.Workspace)/clipsnip"

    - task: AzureKeyVault@2
      displayName: "Fetch secrets from Key Vault"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        KeyVaultName: "$(keyVaultName)"
        SecretsFilter: "SqlAdminPassword"

    - task: AzureCLI@2
      displayName: "Deploy Azure infrastructure"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e

          DEPLOYMENT_NAME="ClipSnip-$(Build.BuildId)"

          echo "Deploying infrastructure..."

          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$(resourceGroupName)" \
            --template-file Infra/main.bicep \
            --parameters \
              appName="$(appName)" \
              sqlAdminPassword="$SQL_ADMIN_PASSWORD"

          echo "Infrastructure deployment completed."

          DEPLOYED_APP_NAME=$(az deployment group show \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$(resourceGroupName)" \
            --query "properties.outputs.appServiceName.value" \
            --output tsv)

          if [ -z "$DEPLOYED_APP_NAME" ]; then
            echo "ERROR: Bicep did not return an App Service name."
            exit 1
          fi

          echo "Deploying application to: $DEPLOYED_APP_NAME"

          echo "##vso[task.setvariable variable=deployedAppName]$DEPLOYED_APP_NAME"

      env:
        SQL_ADMIN_PASSWORD: $(SqlAdminPassword)

    - task: AzureWebApp@1
      displayName: "Deploy ClipSnip to App Service"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        appType: "webAppLinux"
        appName: "$(deployedAppName)"
        package: "$(Pipeline.Workspace)/clipsnip/clipsnip.zip"