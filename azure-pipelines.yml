trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'ClipSnip'
  resourceGroupName: 'ClipSnip-rg'
  appName: 'ClipSnip-webapp'
  buildConfiguration: 'Release'

steps:

- script: |
    echo "Current directory:"
    pwd

    echo "Repository contents:"
    find . -maxdepth 3 -type f | sort
  displayName: 'Debug repository structure'

- task: AzureCLI@2
  displayName: 'Deploy Azure infrastructure'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az deployment group create \
        --resource-group $(resourceGroupName) \
        --template-file infra/main.bicep \
        --parameters \
          appName=$(appName) \
          sqlAdminPassword="$(SQL_ADMIN_PASSWORD)"

- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: sdk
    version: '10.x'

- script: dotnet restore
  displayName: 'Restore packages'

- script: dotnet build --configuration $(buildConfiguration) --no-restore
  displayName: 'Build'

- script: dotnet test --configuration $(buildConfiguration) --no-build --verbosity normal
  displayName: 'Run tests'

- script: |
    dotnet publish ClipSnip/ClipSnip.csproj \
      --configuration $(buildConfiguration) \
      --output $(Build.ArtifactStagingDirectory)/publish
  displayName: 'Publish'

- task: ArchiveFiles@2
  displayName: 'Create deployment package'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/clipsnip.zip'
    replaceExistingArchive: true

- task: AzureWebApp@1
  displayName: 'Deploy ClipSnip to App Service'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    appType: 'webAppLinux'
    appName: '$(appName)'
    package: '$(Build.ArtifactStagingDirectory)/clipsnip.zip'